[package]
name = "canonwright-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "canonwright_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["keyring"]
keyring = ["canonwright-governance/keyring"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
directories = { workspace = true }
ignore = "0.4"
blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
canonwright-core = { path = "../../../crates/canonwright-core" }
canonwright-store = { path = "../../../crates/canonwright-store" }
canonwright-pipeline = { path = "../../../crates/canonwright-pipeline" }
canonwright-agent = { path = "../../../crates/canonwright-agent" }
canonwright-harness = { path = "../../../crates/canonwright-harness" }
canonwright-llm = { path = "../../../crates/canonwright-llm" }
canonwright-tools = { path = "../../../crates/canonwright-tools" }
canonwright-lsp = { path = "../../../crates/canonwright-lsp" }
canonwright-mcp = { path = "../../../crates/canonwright-mcp" }
canonwright-transfer = { path = "../../../crates/canonwright-transfer" }
canonwright-update = { path = "../../../crates/canonwright-update" }
canonwright-terminal = { path = "../../../crates/canonwright-terminal" }
canonwright-workspace = { path = "../../../crates/canonwright-workspace" }
canonwright-index = { path = "../../../crates/canonwright-index" }
canonwright-governance = { path = "../../../crates/canonwright-governance" }
similar = "2"
base64 = "0.22"
async-trait = "0.1"
tokio = { version = "1", features = ["time"] }
calamine = "0.35.0"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
quick-xml = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# In-process clipboard access for the native image paste fallback. The default
# `image-data` feature provides `get_image`; `wayland-data-control` reads the
# clipboard through the compositor instead of shelling out to wl-paste/xclip.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }
png = "0.18"
# Only to narrow GLib's fatal log mask and route criticals to our own log.
glib = "0.18"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
