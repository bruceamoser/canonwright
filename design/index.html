<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canonwright — UX screens</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 32px;
        background: #14161c; color: #f2eff9;
        font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
      p.lede { color: #9a93ad; margin: 0 0 28px; max-width: 74ch; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 32px; }
      figure { margin: 0; }
      a { color: #c5a7ff; text-decoration: none; }
      img {
        width: 100%; height: auto; display: block;
        border: 1px solid #2e3542; border-radius: 10px; background: #1b1f27;
      }
      figcaption { margin-top: 8px; color: #9a93ad; font-size: 12px; }
      figcaption strong { color: #f2eff9; font-weight: 600; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
           color: #6f6885; margin: 36px 0 12px; border-top: 1px solid #2e3542; padding-top: 16px; }
      code { font-family: ui-monospace, "DejaVu Sans Mono", monospace; color: #c5a7ff; }
    </style>
  </head>
  <body>
    <h1>Canonwright — UX screens</h1>
    <p class="lede">
      Built in FigCraft through its MCP server. Source of truth is
      <code>canonwright-ux.figcraft</code>; these PNGs are exports. Regenerate with
      <code>python3 build_screens.py &amp;&amp; python3 build_document.py</code>.
    </p>

    <h2>The machine, first run</h2>
    <figure>
      <a href="screens/00-first-run---github.png"><img src="screens/00-first-run---github.png" alt="First run GitHub" /></a>
      <figcaption>
        <strong>00 · First run — GitHub</strong> — asked before anything else, because an existing manuscript is
        often already a repository rather than a file. Device code, “skip for now”, and what has already been checked.
      </figcaption>
    </figure>

    <h2>Opening a project</h2>
    <div class="pair">
      <figure>
        <a href="screens/01-welcome.png"><img src="screens/01-welcome.png" alt="Welcome" /></a>
        <figcaption><strong>01 · Welcome</strong> — nothing preselected. Two doors, empty recents.</figcaption>
      </figure>
      <figure>
        <a href="screens/02-new-story---what.png"><img src="screens/02-new-story---what.png" alt="What" /></a>
        <figcaption><strong>02 · What are you writing</strong> — novel or rulebook decides the checks and the workspace.</figcaption>
      </figure>
    </div>

    <h2>Setup — two different questions</h2>
    <figure>
      <a href="screens/03-new-manuscript---start.png"><img src="screens/03-new-manuscript---start.png" alt="New manuscript" /></a>
      <figcaption>
        <strong>03 · New manuscript</strong> — a way in, not an inventory: a character, a situation, or a question.
        No cast, no world rules, no chapter list.
      </figcaption>
    </figure>
    <figure>
      <a href="screens/04-existing-manuscript---what-i-read.png"><img src="screens/04-existing-manuscript---what-i-read.png" alt="Existing manuscript" /></a>
      <figcaption>
        <strong>04 · Existing manuscript</strong> — the file is read first (41,200 words, 24 scenes, 3 viewpoints),
        and the questions are produced <em>from what was found</em>: which name is the name, is Harek a protagonist,
        was that unresolved thread deliberate. Answer, skip, or defer to the collaborator.
      </figcaption>
    </figure>

    <h2>The work</h2>
    <figure>
      <a href="screens/05-first-session---collaborator.png"><img src="screens/05-first-session---collaborator.png" alt="Collaborator" /></a>
      <figcaption>
        <strong>05 · First session</strong> — the collaborator opens with proposals. The writer pushes back
        (“make Harek her brother”), and it answers with the consequence. Nothing is canon until accepted.
      </figcaption>
    </figure>
    <div class="pair">
      <figure>
        <a href="screens/06-workspace---novel.png"><img src="screens/06-workspace---novel.png" alt="Novel workspace" /></a>
        <figcaption><strong>06 · Workspace — novel</strong> — scenes, the scene, continuity.</figcaption>
      </figure>
      <figure>
        <a href="screens/07-workspace---rulebook.png"><img src="screens/07-workspace---rulebook.png" alt="Rulebook workspace" /></a>
        <figcaption><strong>07 · Workspace — rulebook</strong> — book tree, entity fields, cross-references.</figcaption>
      </figure>
    </div>
    <figure>
      <a href="screens/08-source-control.png"><img src="screens/08-source-control.png" alt="Source control" /></a>
      <figcaption><strong>08 · Source control</strong> — changes, staged, commit, branches, tags, and the one case that needs a human.</figcaption>
    </figure>
  </body>
</html>
