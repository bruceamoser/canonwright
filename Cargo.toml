[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/canonwright-core",
    "crates/canonwright-story",
    "crates/canonwright-store",
    "crates/canonwright-manuscript",
    "crates/canonwright-harness",
    "crates/canonwright-llm",
    "crates/canonwright-tools",
    "crates/canonwright-agent",
    "crates/canonwright-workspace",
    "crates/canonwright-index",
    "crates/canonwright-memory",
    "crates/canonwright-knowledge",
    "crates/canonwright-autonomic",
    "crates/canonwright-governance",
    "crates/canonwright-mcp",
    "crates/canonwright-update",
    "crates/canonwright-lsp",
    "crates/canonwright-terminal",
    "crates/canonwright-transfer",
    "crates/canonwright-vault",
    "crates/canonwright-pipeline",
]

[workspace.package]
version = "0.2.30"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Bruce Amoser"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
# One codegen unit serialises each crate's LLVM work behind a single thread,
# which is what made a three-platform release a 20-minute wait. Sixteen lets
# rustc parallelise codegen; thin LTO still optimises across the units. The
# cost is a few percent of runtime and a slightly larger binary, which is the
# right trade for a writing app that must publish quickly.
codegen-units = 16
strip = "symbols"
